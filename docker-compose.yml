version: '3.8'

services:
  phishguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: phishguard-app:latest
    container_name: phishguard_system
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
      - FLASK_PORT=5000
      - FLASK_HOST=0.0.0.0
      - FLASK_DEBUG=false
